name: CI

on:
  push:
    branches: [main]
  # No branch filter: every pull request is verified, including ones stacked on
  # another feature branch. Pushes are limited to main so a PR branch is not built twice.
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      # ubuntu-24.04 runners no longer ship sbt.
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # Covers every runtime: core on the JVM, Scala.js and Scala Native, and the cli.
      # Ubuntu runners ship Node for Scala.js and clang for Scala Native.
      - name: Compile and test
        run: sbt test

      # Runs even when the tests fail, so one run reports both signals.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: sbt scalafmtCheckAll

  sbt-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Scripted tests
        run: sbt sbtPluginTest

  gradle-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: gradle/actions/setup-gradle@v4
      # The plugin resolves the core from Maven Local until it is on Maven Central.
      - name: Publish the core locally
        run: sbt coreJVM/publishM2
      - name: Functional tests
        working-directory: gradle-plugin
        run: ./gradlew check

  maven-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: sbt/setup-sbt@v1
      - name: Publish the core locally
        run: sbt coreJVM/publishM2
      - name: Integration tests
        working-directory: maven-plugin
        run: ./mvnw -B verify

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pre-commit
      - name: Hooks end to end
        run: scripts/pre-commit-e2e.sh

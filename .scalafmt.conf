version = "3.10.7"
runner.dialect = scala3

maxColumn = 120
indent.main = 2

# Braces stay. Scala 3 significant-indentation syntax is deliberately NOT adopted,
# and no automatic rewrite to the new control syntax either.
rewrite.scala3.removeOptionalBraces = false
rewrite.scala3.convertToNewSyntax = false

align.preset = most
align.multiline = false

docstrings.style = SpaceAsterisk
docstrings.wrap = no

rewrite.rules = [RedundantParens, SortModifiers]
